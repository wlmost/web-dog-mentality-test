<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Wartungsarbeiten</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
  }
  .wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100%;
    padding: 24px;
  }
  .card {
    max-width: 480px;
    text-align: center;
    background: #fff;
    border-radius: 8px;
    padding: 40px 32px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 12px;
  }
  p {
    margin: 0;
    line-height: 1.5;
    color: #555;
  }
</style>
</head>
<body>
  <div class="wrapper">
    <div class="card">
      <h1>Wartungsarbeiten</h1>
      <p>
        Diese Anwendung wird gerade kurzzeitig aktualisiert und ist in wenigen
        Minuten wieder erreichbar. Bitte versuchen Sie es später erneut.
      </p>
    </div>
  </div>
</body>
</html>
